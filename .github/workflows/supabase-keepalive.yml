name: Supabase Keepalive

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -o /dev/null -w '%{http_code}\n' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "https://hkdxvycifczxvvndsffd.supabase.co/rest/v1/"
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
